<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>…</title>
  <link id="icon" rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="../panel/theme.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    main { max-width: 560px; padding: 24px; text-align: center; }
    img { width: 32px; height: 32px; border-radius: 6px; }
    h1 { margin: 14px 0 6px; font-size: 18px; line-height: 1.5; word-break: break-word; }
    p { margin: 0; color: var(--muted); word-break: break-all; }
    .hint { margin-top: 18px; font-size: 12px; color: var(--faint); }
    button {
      margin-top: 14px;
      padding: 7px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img id="fav" alt="">
    <h1 id="t"></h1>
    <p id="u"></p>
    <p class="hint">标签脉络：这个标签还没加载，切换过来时会自动打开</p>
    <button id="go">现在打开</button>
  </main>
  <script src="lazy.js"></script>
</body>
</html>
