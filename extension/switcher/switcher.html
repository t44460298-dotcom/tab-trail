<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快速搜索 · 标签脉络</title>
  <link rel="stylesheet" href="../panel/theme.css">
  <link rel="stylesheet" href="switcher.css">
</head>
<body>
  <div class="box">
    <div class="bar">
      <span id="qIcon" class="search-icon"></span>
      <input id="q" placeholder="搜索标签、记录、备注……" autocomplete="off" spellcheck="false" autofocus>
    </div>
    <div id="list" class="list"></div>
    <div class="foot">
      <span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
      <span class="grow"></span>
      <span id="count"></span>
    </div>
  </div>
  <script src="../panel/titles.js"></script>
  <script src="../panel/common.js"></script>
  <script src="switcher.js"></script>
</body>
</html>
